# Keep TPM plugins under XDG config instead of ~/.tmux
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'

set -g @plugin 'tmux-plugins/tpm'

# Catppuccin Latte, matching the rest of the desktop -- replaces the old
# hand-rolled warm-light hex (which referenced ~/.config/palette.json, now
# removed) with the same drop-in plugin mechanism already used for TPM.
set -ga terminal-overrides ",*256col*:Tc"

set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'latte'

# Agent-aware session sidebar. Its TPM release bundles are ordinary Linux
# binaries, made runnable on NixOS by programs.nix-ld in the host config.
set -g @plugin 'Ataraxy-Labs/opensessions'

# Session persistence across reboots/logouts -- resurrect saves pane
# layout/cwd/running commands (and, with the option below, scrollback
# content) to a file; continuum periodically calls resurrect's save in
# the background so there's always a recent one to come back to.
# Deliberately NOT `@continuum-restore 'on'` -- that would auto-load the
# last saved environment the moment any tmux server starts, meaning
# every fresh terminal after a reboot resurrects old sessions whether you
# wanted them back or not. Restore stays manual (resurrect's own default
# bind, prefix + Ctrl-r) so a clean `tmux-sessionizer` jump into a new
# project is still the common case, and pulling back what was open is a
# deliberate choice, not a surprise.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

set -g status-position top
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-left-length 20
set -g status-right "#{E:@catppuccin_status_date_time}"

# Focus in/out events (needed by some CLI tools, e.g. Claude Code, to
# detect terminal focus for notifications) -- tmux doesn't forward them
# to panes unless this is on.
set -g focus-events on

# Common QoL bindings
set -g mouse on
set -s escape-time 0
set -g history-limit 50000
set -g base-index 1
set -g renumber-windows on
set-window-option -g mode-keys vi

# Splits open in the current pane's path instead of $HOME
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vi-style pane navigation, repeatable
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# vi-style repeatable pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind -r Space last-window
bind y set-window-option synchronize-panes

# Reload config in place
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ThePrimeagen's tmux-sessionizer: https://github.com/ThePrimeagen/tmux-sessionizer
bind -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

run '~/.config/tmux/plugins/tpm/tpm'
