# See ~/.local/bin/tmux-sessionizer's own header comment for the full
# format. Adds ~/Documents/projects as an extra search path (on top of the
# script's built-in defaults: ~/ ~/personal ~/personal/dev/env/.config) --
# default depth (TS_MAX_DEPTH, 1) is fine here, each immediate subdirectory
# of projects/ is its own project.
TS_EXTRA_SEARCH_PATHS=(~/Documents/projects)
