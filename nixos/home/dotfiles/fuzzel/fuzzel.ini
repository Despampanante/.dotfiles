# Fuzzel — app launcher, replaces wofi. Warm-light palette (see
# ~/.config/palette.json). Colors are RRGGBBAA (no leading '#').

[main]
font=Iosevka:size=11
prompt=❯
icon-theme=Adwaita
terminal=wezterm
layer=overlay

[colors]
background=ece4d8ff
text=2e2a22ff
match=7e5701ff
selection=7e5701ff
selection-text=ece4d8ff
selection-match=fdf5e9ff
border=7e5701ff

[border]
width=2
radius=6

[dmenu]
exit-immediately-if-empty=yes
