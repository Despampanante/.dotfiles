# Fuzzel — app launcher, replaces wofi. Catppuccin Latte
# (catppuccin.com/palette). Colors are RRGGBBAA (no leading '#').

[main]
font=Iosevka Nerd Font:size=11
prompt=❯
icon-theme=Adwaita
terminal=wezterm
layer=overlay

[colors]
background=eff1f5ff
text=4c4f69ff
match=fe640bff
selection=fe640bff
selection-text=eff1f5ff
selection-match=e6e9efff
border=fe640bff

[border]
width=2
radius=6

[dmenu]
exit-immediately-if-empty=yes
